<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 430" width="880" height="430" role="img" aria-label="FakeBusiness Ops Agent architecture" xmlns:c2pa="http://c2pa.org/manifest"><style>text{font-family:'Open Sans','Noto Sans','Segoe UI',Helvetica,Arial,sans-serif}
.box{animation:pop .5s ease-out both}
.fade{animation:fade .4s ease both}
.draw{stroke-dasharray:1;animation:draw .5s ease-out both}
.march{stroke-dasharray:4 4;animation:march .8s linear infinite}
.halo{stroke-width:2;opacity:0;transform-box:fill-box;transform-origin:center;animation:halo 3s ease-out 8s infinite}
.gate{animation-delay:9.5s}
@keyframes pop{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes draw{from{stroke-dashoffset:1;opacity:0}1%{opacity:1}to{stroke-dashoffset:0;opacity:1}}
@keyframes march{to{stroke-dashoffset:-8}}
@keyframes halo{0%{opacity:.6;transform:scale(1)}60%,100%{opacity:0;transform:scale(1.08,1.16)}}
